name: Validate Betfair AU adapter

on:
  push:
    branches: [main]
    paths:
      - "betfair-au-proxy/**"
      - ".github/workflows/validate-betfair-au.yml"
  pull_request:
    paths:
      - "betfair-au-proxy/**"
      - ".github/workflows/validate-betfair-au.yml"

jobs:
  powershell-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse launcher with Windows PowerShell
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $env:GITHUB_WORKSPACE "betfair-au-proxy/Start-BetfairAuProxy.ps1"),
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
          Write-Host "PowerShell launcher parsed successfully."

  node-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check adapter JavaScript syntax
        shell: pwsh
        run: |
          node --check betfair-au-proxy/server.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check betfair-au-proxy/race-category.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
