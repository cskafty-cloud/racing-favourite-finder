name: Build public Windows desktop app

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'public/app.js'
      - 'package.json'
      - 'package-lock.json'
      - 'server.js'
      - 'memory-guards.js'
      - 'test/**'
      - '.github/workflows/windows-app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run data-quality regression tests
        run: npm test
      - name: Check application and adapter syntax
        run: |
          node --check server.js
          node --check betfair-au-proxy/server.js
          node --check betfair-feed.js
          node --check public/app.js
      - name: Build portable Windows executable
        run: npm run desktop:dist
      - name: Verify portable executable
        shell: pwsh
        run: |
          $target = Join-Path 'release' 'CSKAFTY.exe'
          if (-not (Test-Path -LiteralPath $target -PathType Leaf)) { throw 'CSKAFTY.exe was not produced.' }
          if ((Get-Item -LiteralPath $target).Length -lt 10000000) { throw 'Executable is unexpectedly small.' }
      - name: Publish public GitHub release
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: desktop-v1.0.${{ github.run_number }}
          name: Racing Favourite Finder for Windows v1.0.${{ github.run_number }}
          artifacts: release/CSKAFTY.exe
          artifactErrorsFailBuild: true
          generateReleaseNotes: true
          makeLatest: true
