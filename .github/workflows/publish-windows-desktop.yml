name: Publish Windows desktop release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish-windows:
    if: contains(github.event.head_commit.message, '[publish-desktop]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Windows portable executable
        run: npm run desktop:dist
      - name: Verify and name release executable
        shell: pwsh
        run: |
          $target = Join-Path 'release' 'CSKAFTY.exe'
          if (-not (Test-Path -LiteralPath $target -PathType Leaf)) {
            $exe = Get-ChildItem -Path release -Filter '*.exe' -File | Select-Object -First 1
            if (-not $exe) { throw 'Portable Windows executable was not produced.' }
            Copy-Item -LiteralPath $exe.FullName -Destination $target
          }
          if ((Get-Item -LiteralPath $target).Length -lt 10000000) {
            throw 'Executable is unexpectedly small.'
          }
          Write-Host "Verified $target ($((Get-Item -LiteralPath $target).Length) bytes)."
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: desktop-v1.0.2
          name: Racing Favourite Finder Desktop v1.0.2
          body: |
            Windows portable desktop build for Racing Favourite Finder.
            Includes the patched Electron, Electron Builder and Sharp dependency versions.
            Download CSKAFTY.exe and run it on Windows.
          files: release/CSKAFTY.exe
          draft: false
          prerelease: false
          make_latest: true
