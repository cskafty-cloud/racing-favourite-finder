name: Publish Windows desktop release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish-windows:
    if: contains(github.event.head_commit.message, '[publish-desktop]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Windows portable executable
        run: npm run desktop:dist
      - name: Verify and name release executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path release -Filter '*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Portable Windows executable was not produced.' }
          Copy-Item $exe.FullName 'release/CSKAFTY.exe' -Force
          if ((Get-Item 'release/CSKAFTY.exe').Length -lt 10000000) { throw 'Executable is unexpectedly small.' }
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v1.0.2
          name: Racing Favourite Finder Desktop v1.0.2
          body: |
            Windows portable desktop build for Racing Favourite Finder.
            Includes the patched Electron, Electron Builder and Sharp dependency versions.
            Download CSKAFTY.exe and run it on Windows.
          files: release/CSKAFTY.exe
          draft: false
          prerelease: false
          make_latest: true
